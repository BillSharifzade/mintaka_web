# Site-wide facts. Every value in this file is published on the page.

# Published at https://dchr.koinotinav.com/mintaka/ — a path on our hosting provider's domain —
# until Mintaka has a domain of its own (spec §16 question 1). The server strips `base` from
# requests; `MINTAKA_BASE= cargo xtask build` builds for the root instead (local previews).
origin = "https://dchr.koinotinav.com"
base = "/mintaka"
default_lang = "en"
# In the spec's order (§11); the order sets the language switch and hreflang lists, nothing else.
# The build fails on any missing string. The Russian and Tajik copy was drafted by Claude at the
# founder's request on 2026-10-30 and should be reviewed by native speakers (docs/TRANSLATION.md).
langs = ["tg", "ru", "en"]

# Flip to true when the domain and every contact detail below are final. Release builds warn
# loudly while it is false.
launch_ready = false

[company]
name = "Mintaka"
city = "Dushanbe"
country = "Tajikistan"
# Dushanbe city centre — used for the static physics table in S2 (great-circle distances).
lat = 38.5598
lon = 68.7870

[lab]
# Lab posts link to their code here (spec §S11). The build checks that every linked path exists
# in this working tree; links point at `branch`, so publish from that branch.
repo = "https://github.com/BillSharifzade/mintaka_web"
branch = "main"

[hosting]
# Who runs the machine (the privacy page names them) and whether a proxy of theirs ends visitors'
# HTTPS connections before they reach our server (it does: the provider's edge for its domain).
provider = "Koinot Innovations and Technologies"
city = "Dushanbe"
country = "Tajikistan"
edge = true

[contact]
# For now the founder's phone is the one public contact; add email and Telegram when they exist.
# (Empty details are not published. security.txt and the careers link fall back to the phone.)
email = ""
telegram = ""
phone = "+992 98 544 70 72"
careers_email = ""
security_email = ""
reply_within = "one working day"

