# Site-wide facts. Every value in this file is published on the page.

# Placeholder domain until it is secured (spec §16 question 1).
origin = "https://mintaka.tj"
default_lang = "en"
# Add "ru" and "tg" once content/ru and content/tg are complete — the build fails on any missing
# string, and translations are written natively by the team, never machine-translated.
langs = ["en"]

# Flip to true when the domain and every contact detail below are final. Release builds warn
# loudly while it is false.
launch_ready = false

[company]
name = "Mintaka"
city = "Dushanbe"
country = "Tajikistan"
# Dushanbe city centre — used for the static physics table in S2 (great-circle distances).
lat = 38.5598
lon = 68.7870

[contact]
email = "hello@mintaka.tj"
telegram = "mintaka"
phone = ""
careers_email = "jobs@mintaka.tj"
security_email = "security@mintaka.tj"
reply_within = "one working day"

# ---------------------------------------------------------------------------------------------
# Claims about our own practice. Text: content/{lang}/page.ftl, message id = key.
# Mark `verified = true` only when it is true today — release builds drop everything else.
# ---------------------------------------------------------------------------------------------

