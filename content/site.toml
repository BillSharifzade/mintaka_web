# ---------------------------------------------------------------------------------------------
# A/B test on the landing page itself (spec §12; docs/CONTRACTS.md §17). One at a time. Every
# enabled language's home page is built once per variant; the server picks one per page load,
# with no cookie. Beacons count page views and conversions per variant, in memory, until each
# variant has `sample_size` page views — then the console shows the verdict, and counting stops.
# Remove this table (or start a new test with a new id) to end it.
# ---------------------------------------------------------------------------------------------
[experiment]
id = "hero-headline"
# Message ids in content/{lang}/page.ftl: the control as it is, then the alternatives (spec §S1).
control = "hero-title"
variants = ["hero-title-hardware", "hero-title-cycle"]
# Primary metric: a page view converts when it follows a link to #contact ("Start a project").
metric = "cta_start_project"
# Counted per variant for context — a headline that wins clicks but loses briefs is no win — and
# never tested: the sample size is planned for the primary metric, at whose size a brief is too
# rare to judge, and every extra test would raise the chance of a false positive.
secondary = ["contact_submit"]
# Planning assumptions, decided before the test starts. Placeholders until two weeks of /_rum show
# the real baseline (spec §2.3: cta_start_project per page view of /en/).
baseline = 0.05   # share of home page views that follow a link to the contact form
mde = 0.30        # smallest lift worth finding, relative: 5 % → 6.5 %
alpha = 0.05      # family-wise false-positive rate, two-sided, shared by the 2 comparisons
power = 0.80      # chance of finding a true lift of `mde` in one comparison
# Page views per variant that these imply (two-proportion z-test, alpha 0.025 each); the build
# recomputes it and fails if this disagrees. 3 variants: 13,734 page views in all.
sample_size = 4578

