[package]
name = "fuzzer"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "S5 Attack our code: a coverage-guided fuzzer attacking a small Rust parser of ours, for WebAssembly."

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.mintaka]
wasm = true
# Plain C-ABI exports read straight from memory: no glue, and the crash is a trap the host catches.
bindgen = false
