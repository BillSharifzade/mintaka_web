[package]
name = "server"
description = "mintaka.tj production HTTP server: rustls (post-quantum), in-memory static site, /_proof, /_telemetry, contact."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "mintaka-server"
path = "src/main.rs"

[lib]
name = "server"
path = "src/lib.rs"

[dependencies]
proof.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-util"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "server-auto", "server-graceful", "http1", "http2"] }
axum = { version = "0.8", default-features = false }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pki-types = { version = "1", features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
hdrhistogram = { version = "7", default-features = false }
libc = "0.2"
bytes = "1"
http = "1"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
rand = "0.8"
age = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
webpki-roots = "1"
form_urlencoded = "1"
tower-service = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http-body-util = "0.1"

[dev-dependencies]
hyper = { version = "1", features = ["client", "http1", "http2"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "process", "io-util"] }
