[package]
name = "routing"
description = "Shortest paths on Dushanbe's roads — Dijkstra, A* and Contraction Hierarchies (spec S4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.mintaka]
wasm = true

[features]
# Build-time graph preparation from an OpenStreetMap extract (used by xtask; never in the wasm).
prep = ["dep:serde_json"]

[dependencies]
wasm-bindgen = "=0.2.128"
serde_json = { workspace = true, optional = true }
