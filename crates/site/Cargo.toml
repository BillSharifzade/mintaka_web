[package]
name = "site"
description = "Static site generator for mintaka.tj: templates, strings, CSS, fonts, assets → dist/."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
proof.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.23"
brotli = "9"
flate2 = "1"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
lightningcss = { version = "1.0.0-alpha.72", default-features = false, features = ["bundler"] }
maud = "0.27"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
pulldown-latex = "0.8"
resvg = { version = "0.49", default-features = false }
sha2 = "0.11"
toml = "0.9"
ttf-parser = { version = "0.25", default-features = false, features = ["std", "opentype-layout"] }
unic-langid = "0.9"

[dev-dependencies]
roxmltree = "0.21"
